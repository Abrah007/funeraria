    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.292.0",

  <body>
    <div id="root"></div>

    <!-- Script Principal de la Aplicación -->
    <script type="text/babel" data-type="module" data-presets="typescript,react">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { 
        Phone, MapPin, Clock, Menu, X, Heart, Leaf, 
        ShieldCheck, Users, BrainCircuit, Euro, Sparkles, Send, Loader2 
      } from 'lucide-react';
      import { GoogleGenAI } from '@google/genai';

      // --- SERVICIO GEMINI (geminiService.ts) ---
      
      // Manejo seguro de API KEY en entorno navegador (Simulación para demo si no hay env)
      const getAiClient = () => {
        try {
          // Verificación segura de process.env
          const apiKey = (typeof process !== 'undefined' && process && process.env) ? process.env.API_KEY : '';
          return apiKey ? new GoogleGenAI({ apiKey }) : null;
        } catch (e) {
          console.warn("No API Key found in environment");
          return null;
        }
      };

      const ai = getAiClient();

      const generateTribute = async (
        name,
        relationship,
        memories,
        tone
      ) => {
        if (!ai) {
          // Fallback modo demo
          return new Promise((resolve) => {
              setTimeout(() => {
                  resolve(`(Modo Demo - Sin API Key)\n\nEn memoria de ${name}, quien fue un ${relationship} excepcional. Recordaremos siempre: "${memories}". Que descanse en paz en su último paseíto.`);
              }, 1500);
          });
        }

        try {
          const model = 'gemini-3-flash-preview';
          const prompt = `
            Actúa como un asistente compasivo y profesional de la funeraria "Último Paseíto".
            Escribe un breve y conmovedor obituario o mensaje de homenaje para ${name}.
            Relación con el solicitante: ${relationship}.
            Recuerdos clave o características a mencionar: ${memories}.
            Tono deseado: ${tone} (ej. solemne, celebrando la vida, poético).
            
            El mensaje debe ser respetuoso, cálido y honrar su memoria. Máximo 150 palabras.
          `;

          const response = await ai.models.generateContent({
            model: model,
            contents: prompt,
          });

          return response.text || "No se pudo generar el mensaje en este momento.";
        } catch (error) {
          console.error("Error generando homenaje:", error);
          return "Lo sentimos, hubo un error al conectar con nuestro asistente inteligente. Por favor intente más tarde.";
        }
      };

      // --- COMPONENTE AITribute (components/AITribute.tsx) ---

      const AITribute = () => {
        const [name, setName] = useState('');
        const [relationship, setRelationship] = useState('');
        const [memories, setMemories] = useState('');
        const [tone, setTone] = useState('Solemne y Respetuoso');
        const [result, setResult] = useState('');
        const [loading, setLoading] = useState(false);

        const handleGenerate = async (e) => {
          e.preventDefault();
          if (!name || !relationship) return;

          setLoading(true);
          const text = await generateTribute(name, relationship, memories, tone);
          setResult(text);
          setLoading(false);
        };

        return (
          <div className="bg-white rounded-2xl shadow-xl overflow-hidden border border-brand-100">
            <div className="bg-brand-900 p-6 text-white text-center relative overflow-hidden">
              <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://picsum.photos/800/200?blur=5')] bg-cover"></div>
              <Sparkles className="w-8 h-8 mx-auto mb-2 text-brand-gold animate-pulse" />
              <h3 className="text-2xl font-serif font-bold">Homenaje Digital con IA</h3>
              <p className="text-brand-100 text-sm mt-2">
                Como parte de nuestra innovación, le ayudamos a encontrar las palabras perfectas para despedir a su ser querido. (Gratuito)
              </p>
            </div>

            <div className="p-6 md:p-8">
              {!result ? (
                <form onSubmit={handleGenerate} className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Nombre del Difunto</label>
                    <input
                      type="text"
                      required
                      className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition"
                      placeholder="Ej. María García"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                    />
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Su relación</label>
                      <input
                        type="text"
                        required
                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"
                        placeholder="Ej. Madre, Amigo, Abuelo"
                        value={relationship}
                        onChange={(e) => setRelationship(e.target.value)}
                      />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Tono del mensaje</label>
                      <select
                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none bg-white"
                        value={tone}
                        onChange={(e) => setTone(e.target.value)}
                      >
                        <option>Solemne y Respetuoso</option>
                        <option>Celebración de Vida</option>
                        <option>Cálido y Cercano</option>
                        <option>Poético</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Recuerdos o cualidades (Opcional)</label>
                    <textarea
                      className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 outline-none"
                      rows={3}
                      placeholder="Ej. Amaba la jardinería, siempre sonreía, ayudaba a todos..."
                      value={memories}
                      onChange={(e) => setMemories(e.target.value)}
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full bg-brand-800 hover:bg-brand-900 text-white font-medium py-3 rounded-lg transition flex items-center justify-center gap-2 disabled:opacity-70"
                  >
                    {loading ? (
                      <>
                        <Loader2 className="w-5 h-5 animate-spin" /> Generando palabras...
                      </>
                    ) : (
                      <>
                        <Sparkles className="w-5 h-5" /> Generar Homenaje
                      </>
                    )}
                  </button>
                </form>
              ) : (
                <div className="space-y-6 animate-fade-in">
                  <div className="bg-brand-50 p-6 rounded-lg border border-brand-100 italic font-serif text-gray-800 leading-relaxed text-lg">
                    "{result}"
                  </div>
                  <div className="flex gap-3">
                    <button
                      onClick={() => { setResult(''); setName(''); setMemories(''); }}
                      className="flex-1 px-4 py-2 border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition"
                    >
                      Crear otro
                    </button>
                    <button
                      className="flex-1 px-4 py-2 bg-brand-gold text-white rounded-lg hover:bg-yellow-600 transition flex items-center justify-center gap-2"
                      onClick={() => alert("Funcionalidad de guardado en desarrollo. Por favor copie el texto.")}
                    >
                      <Send className="w-4 h-4" /> Guardar / Enviar
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      // --- COMPONENTE PRINCIPAL (App.tsx) ---

      // Icono custom para la sección de innovación
      const SparklesIcon = ({ className }) => (

      );

      // Datos
      const services = [
        {
          title: "Servicio Básico de Sepelio",
          price: "1.800€",
          desc: "Incluye féretro estándar, preparación del difunto, velatorio en sala común y ceremonia básica. Descuento del 15% disponible.",
        },
        {
          title: "Servicio de Cremación",
          price: "1.500€",
          desc: "Incluye urna básica, ceremonia íntima y gestión completa de cenizas. Una opción digna y respetuosa.",

        {
          title: "Velatorio Privado",

        { name: "Abrahán García", role: "Transporte Funerario", img: "fotos/Abrahan.png" },
        { name: "Juan Parejo", role: "Admin. e Informática", img: "fotos/Juan.png" },

          <div className="min-h-screen bg-gray-50 font-sans text-gray-800">

              <div className="container mx-auto flex justify-between items-center">
                <div className="flex items-center gap-4">
                  <span className="flex items-center gap-1"><Clock className="w-4 h-4 text-brand-gold" /> Atención 24 Horas</span>
                  <span className="hidden md:flex items-center gap-1"><MapPin className="w-4 h-4 text-brand-gold" /> Los Palacios y Villafranca, Sevilla</span>
                </div>
                <a href="tel:+34900000000" className="flex items-center gap-1 hover:text-brand-gold transition">
                  <Phone className="w-4 h-4" /> 900 000 000
                </a>
              </div>
            </div>

            {/* Navigation */}
            <nav className={`sticky top-0 z-50 transition-all duration-300 ${scrolled ? 'bg-white shadow-lg py-2' : 'bg-white/95 backdrop-blur-md py-4'}`}>
              <div className="container mx-auto px-4 flex justify-between items-center">
                <div className="flex items-center gap-4">
                  {/* Logo Real */}
                  <div className="h-16 w-16 md:h-20 md:w-20 relative flex-shrink-0 transition-all duration-300">
                    <img 
                      src="./logo.png" 
                      alt="Logo Funeraria Último Paseíto" 
                      className="w-full h-full object-contain drop-shadow-sm hover:scale-105 transition-transform duration-300"
                      onError={(e) => {
                        e.target.style.display = 'none';
                        e.target.nextElementSibling.classList.remove('hidden');
                      }}
                    />
                    {/* Fallback */}
                    <div className="hidden w-full h-full bg-brand-800 rounded-full flex items-center justify-center text-brand-gold text-xs text-center p-1 border-2 border-brand-gold">
                        UP
                    </div>
                  </div>
                  <div className="flex flex-col justify-center">
                    <h1 className="font-serif text-xl md:text-2xl font-bold text-brand-800 leading-none tracking-tight">Último Paseíto</h1>
                    <div className="h-0.5 w-12 bg-brand-gold my-1 rounded-full"></div>
                    <p className="text-[10px] md:text-xs text-brand-500 tracking-[0.2em] font-bold uppercase">Sevilla</p>
                  </div>
                </div>

                {/* Desktop Menu */}
                <div className="hidden md:flex items-center gap-8 font-medium text-gray-700">
                  <button onClick={() => scrollTo('inicio')} className="hover:text-brand-800 hover:scale-105 transition">Inicio</button>
                  <button onClick={() => scrollTo('servicios')} className="hover:text-brand-800 hover:scale-105 transition">Servicios</button>
                  <button onClick={() => scrollTo('innovacion')} className="hover:text-brand-800 hover:scale-105 transition">Innovación & IA</button>
                  <button onClick={() => scrollTo('nosotros')} className="hover:text-brand-800 hover:scale-105 transition">Nosotros</button>
                  <button onClick={() => scrollTo('contacto')} className="px-6 py-2 bg-brand-800 text-white rounded-md hover:bg-brand-900 transition shadow-md border-b-2 border-brand-gold">
                    Contactar
                  </button>
                </div>

                {/* Mobile Menu Button */}
                <button className="md:hidden text-brand-900 p-2" onClick={() => setIsMenuOpen(!isMenuOpen)}>
                  {isMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                </button>
              </div>

              {/* Mobile Menu Dropdown */}
              {isMenuOpen && (
                <div className="md:hidden bg-white border-t border-brand-100 absolute w-full shadow-xl">
                  <div className="flex flex-col p-4 gap-4 text-center">
                    <button onClick={() => scrollTo('inicio')} className="py-2 hover:bg-brand-50 rounded text-brand-900 font-medium">Inicio</button>
                    <button onClick={() => scrollTo('servicios')} className="py-2 hover:bg-brand-50 rounded text-brand-900 font-medium">Servicios</button>
                    <button onClick={() => scrollTo('innovacion')} className="py-2 hover:bg-brand-50 rounded text-brand-900 font-medium">Innovación</button>
                    <button onClick={() => scrollTo('nosotros')} className="py-2 hover:bg-brand-50 rounded text-brand-900 font-medium">Nosotros</button>
                    <button onClick={() => scrollTo('contacto')} className="py-3 bg-brand-800 text-white rounded font-bold shadow-md">Contactar</button>
                  </div>
                </div>
              )}
            </nav>

            {/* Hero Section */}
            <section id="inicio" className="relative h-[85vh] md:h-[750px] flex items-center justify-center overflow-hidden">
              <div className="absolute inset-0 z-0">
                <img 
                  src="https://picsum.photos/1920/1080?grayscale&blur=2" 
                  alt="Cielo sereno" 
                  className="w-full h-full object-cover scale-105 animate-[pulse_20s_ease-in-out_infinite]"
                />
                <div className="absolute inset-0 bg-gradient-to-b from-brand-900/60 via-brand-800/40 to-white/95"></div>
              </div>

              <div className="container mx-auto px-4 relative z-10 text-center max-w-4xl mt-10">
                <div className="mb-8 inline-flex items-center gap-2 px-6 py-2 bg-white/10 backdrop-blur-md rounded-full border border-white/30 text-white shadow-lg">
                  <span className="w-2 h-2 rounded-full bg-brand-gold animate-pulse"></span>
                  <span className="font-serif italic tracking-wide">Honor y Serenidad en Sevilla</span>
                </div>
                <h2 className="font-serif text-4xl md:text-6xl lg:text-7xl font-bold text-brand-900 mb-8 leading-tight drop-shadow-sm">
                  Porque cada despedida merece un <span className="text-brand-800 relative inline-block">último paseo<span className="absolute bottom-2 left-0 w-full h-3 bg-brand-gold/20 -z-10 skew-x-12"></span></span>.
                </h2>
                <p className="text-lg md:text-xl text-gray-700 mb-10 font-light max-w-2xl mx-auto leading-relaxed">
                  Combinamos la tradición, el respeto y la innovación para ofrecer un servicio humano en los momentos más difíciles.
                </p>
                <div className="flex flex-col md:flex-row gap-5 justify-center">
                  <button onClick={() => scrollTo('contacto')} className="px-8 py-4 bg-brand-800 text-white rounded-md font-semibold hover:bg-brand-900 transition shadow-lg hover:shadow-brand-500/25 transform hover:-translate-y-1 border-b-4 border-brand-900">
                    Atención Inmediata
                  </button>
                  <button onClick={() => scrollTo('servicios')} className="px-8 py-4 bg-white text-brand-900 border border-brand-200 rounded-md font-semibold hover:bg-brand-50 transition shadow-md">
                    Ver Catálogo
                  </button>
                </div>
              </div>
            </section>

            {/* Value Proposition */}
            <section className="py-24 bg-white relative">
              <div className="container mx-auto px-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                  <div className="text-center p-8 rounded-xl bg-brand-50/30 hover:bg-brand-50 transition duration-500 hover:shadow-lg group border border-transparent hover:border-brand-100">
                    <div className="w-16 h-16 bg-white shadow-md rounded-full flex items-center justify-center mx-auto mb-6 text-brand-800 group-hover:text-brand-gold transition-colors duration-300">
                      <Heart className="w-7 h-7" />
                    </div>

                    <div className="w-16 h-16 bg-white shadow-md rounded-full flex items-center justify-center mx-auto mb-6 text-brand-800 group-hover:text-brand-gold transition-colors duration-300">
                      <ShieldCheck className="w-7 h-7" />

              <div className="container mx-auto px-4 relative z-10">
